<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FFFDF9" stroke="#E2DCD5" stroke-width="2" filter="url(#shadow2)"/>
  
  <rect x="20" y="20" width="560" height="70" rx="8" fill="#1565C0" />
  <text x="300" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INTERNATIONAL ACADEMY OF TOKYO</text>
  <text x="300" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#BBDEFB" text-anchor="middle">Administration Office Notice</text>

  <text x="300" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0D47A1" text-anchor="middle">TERM 2 OPENING CEREMONY</text>
  <line x1="100" y1="150" x2="500" y2="150" stroke="#90CAF9" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="170" width="500" height="110" rx="6" fill="#E3F2FD" stroke="#BBDEFB"/>
  <text x="70" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#1565C0">SCHEDULE (日程)</text>
  <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#333333">• Date: <tspan font-weight="bold" fill="#D32F2F">Monday, August 25th</tspan></text>
  <text x="70" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">• Hours: <tspan font-weight="bold">8:15 AM - 11:30 AM (Early Dismissal)</tspan></text>
  <text x="360" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#C62828">* No school lunch</text>

  <rect x="50" y="300" width="500" height="200" rx="6" fill="#FFF8E1" stroke="#FFE082"/>
  <text x="70" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#F57F17">REQUIRED ITEMS (持ち物)</text>
  <text x="70" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">1. Clean Indoor Shoes (上履き)</text>
  <text x="70" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">2. Disaster Evacuation Hood (防災頭巾)</text>
  <text x="70" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">3. Summer Homework Package (夏休みの宿題一式)</text>
  <text x="70" y="455" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">4. Health Check Card (健康観察カード)</text>
  <text x="70" y="485" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">5. Student Communication Notebook (連絡帳)</text>

  <rect x="50" y="520" width="500" height="120" rx="6" fill="#F5F5F5" stroke="#E0E0E0"/>
  <text x="70" y="555" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#424242">GENERAL NOTES (注意事項)</text>
  <text x="70" y="585" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#616161">• Regular full-day classes with school lunch will resume on Tuesday, August 26th.</text>
  <text x="70" y="615" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#616161">• Please make sure your child is well-rested and arrives on time before 8:15 AM.</text>
</svg>
