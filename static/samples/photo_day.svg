<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FFFDF8" stroke="#E2DCD5" stroke-width="2" filter="url(#shadow4)"/>
  
  <rect x="20" y="20" width="560" height="70" rx="8" fill="#4A148C" />
  <text x="300" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INTERNATIONAL ACADEMY OF TOKYO</text>
  <text x="300" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E1BEE7" text-anchor="middle">Student Affairs &amp; Yearbook Committee</text>

  <text x="300" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#311B92" text-anchor="middle">ANNUAL SCHOOL PHOTO DAY</text>
  <line x1="100" y1="150" x2="500" y2="150" stroke="#CE93D8" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="170" width="500" height="110" rx="6" fill="#F3E5F5" stroke="#E1BEE7"/>
  <text x="70" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#4A148C">PHOTO SHOOT DETAILS (撮影日時)</text>
  <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#333333">• Date: <tspan font-weight="bold" fill="#D32F2F">Monday, September 28th</tspan></text>
  <text x="70" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">• Time: <tspan font-weight="bold">9:00 AM - 12:00 PM</tspan> (Multi-Purpose Hall)</text>

  <rect x="50" y="300" width="500" height="150" rx="6" fill="#E0F2F1" stroke="#80CBC4"/>
  <text x="70" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#00695C">DRESS CODE &amp; PREPARATION (服装・持ち物)</text>
  <text x="70" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">1. Formal Full Uniform (Blazer, Tie/Ribbon, Clean Socks)</text>
  <text x="70" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">2. School ID Badge attached on chest</text>
  <text x="70" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">3. Personal hair comb or brush for grooming</text>

  <rect x="50" y="470" width="500" height="120" rx="6" fill="#FFEBEE" stroke="#FFCDD2"/>
  <text x="70" y="505" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#C62828">PACKAGE ORDER FORM (注文用紙提出)</text>
  <text x="70" y="535" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#B71C1C">Please return the photo package order envelope by:</text>
  <text x="70" y="560" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#D32F2F">DEADLINE: Sunday, September 20th</text>
</svg>
