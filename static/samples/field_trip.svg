<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Paper Background -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FDFBF7" stroke="#E2DCD5" stroke-width="2" filter="url(#paper-shadow)"/>
  
  <!-- School Header -->
  <rect x="20" y="20" width="560" height="70" rx="8" fill="#2E7D32" />
  <text x="300" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INTERNATIONAL ACADEMY OF TOKYO</text>
  <text x="300" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C8E6C9" text-anchor="middle">Elementary School Newsletter - Autumn Term</text>

  <!-- Title -->
  <text x="300" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#1B5E20" text-anchor="middle">AUTUMN FIELD TRIP NOTICE</text>
  <line x1="100" y1="150" x2="500" y2="150" stroke="#81C784" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Content Box -->
  <rect x="50" y="170" width="500" height="110" rx="6" fill="#E8F5E9" stroke="#C8E6C9"/>
  <text x="70" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">DATE &amp; DESTINATION</text>
  <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#333333">• Date: <tspan font-weight="bold" fill="#D32F2F">Friday, September 12th</tspan></text>
  <text x="70" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#333333">• Destination: <tspan font-weight="bold">Port Aquarium (みなと水族館)</tspan></text>
  <text x="360" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#555555">Depart: 8:30 AM</text>
  <text x="360" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#555555">Return: 3:00 PM</text>

  <!-- Items to Bring -->
  <rect x="50" y="300" width="500" height="160" rx="6" fill="#FFFDE7" stroke="#FFF59D"/>
  <text x="70" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#F57F17">WHAT TO BRING (持ち物)</text>
  <text x="70" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">1. Packed Lunch (お弁当) - Disposable container preferred</text>
  <text x="70" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">2. Water Bottle (水筒) - Refillable with strap</text>
  <text x="70" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">3. Leisure Sheet / Picnic Mat (レジャーシート)</text>
  <text x="70" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">4. Backpack &amp; Raincoat / Poncho (雨具)</text>

  <!-- Notice & Permission Slip -->
  <rect x="50" y="480" width="500" height="130" rx="6" fill="#FFEBEE" stroke="#FFCDD2"/>
  <text x="70" y="515" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#C62828">IMPORTANT DEADLINE (提出締切)</text>
  <text x="70" y="545" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#D32F2F" font-weight="bold">Please sign &amp; return the attached Permission Slip</text>
  <text x="70" y="570" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#B71C1C">DUE DATE: Thursday, September 4th</text>
  <text x="70" y="595" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#666666">* Students without signed permission slips cannot board the bus.</text>

  <!-- Cut Line for slip -->
  <line x1="50" y1="640" x2="550" y2="640" stroke="#888888" stroke-dasharray="6,6"/>
  <text x="300" y="655" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#888888" text-anchor="middle">✂ - - - - - - - - - - - - Cut here &amp; return to homeroom teacher - - - - - - - - - - - - ✂</text>

  <rect x="60" y="670" width="480" height="85" rx="4" fill="#FAFAFA" stroke="#DDDDDD"/>
  <text x="80" y="700" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#333333">FIELD TRIP PERMISSION &amp; EMERGENCY CONTACT SLIP</text>
  <text x="80" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#555555">Student Name: _____________________  Parent Signature: _____________________</text>
</svg>
