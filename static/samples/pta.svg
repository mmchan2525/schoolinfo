  <text x="70" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">1. Gardening / Heavy Work Gloves (軍手)</text>
  <text x="70" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">2. Face Towel (タオル)</text>
  <text x="70" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">3. Sun Hat / Visor (帽子)</text>
  <text x="70" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">4. Water Bottle &amp; Sports Drink (水筒・水分)</text>

