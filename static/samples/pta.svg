<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="560" height="760" rx="8" fill="#FFFCF8" stroke="#E2DCD5" stroke-width="2" filter="url(#shadow3)"/>
  
  <rect x="20" y="20" width="560" height="70" rx="8" fill="#E65100" />
  <text x="300" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PARENT TEACHER ASSOCIATION (PTA)</text>
  <text x="300" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFE0B2" text-anchor="middle">Community &amp; Environment Committee</text>

  <text x="300" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#BF360C" text-anchor="middle">CAMPUS CLEANUP &amp; WEEDING DAY</text>
  <line x1="100" y1="150" x2="500" y2="150" stroke="#FFAB91" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="170" width="500" height="110" rx="6" fill="#FFF3E0" stroke="#FFE0B2"/>
  <text x="70" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#E65100">EVENT DETAILS (日時・場所)</text>
  <text x="70" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#333333">• Date: <tspan font-weight="bold" fill="#D32F2F">Saturday, August 29th</tspan></text>
  <text x="70" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#333333">• Time: <tspan font-weight="bold">8:30 AM - 10:30 AM</tspan> (Meet at Main Playground)</text>

